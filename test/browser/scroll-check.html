<!doctype html>
<!-- OWNER: Agent B. Real-pipeline false-alarm check: a 2940x1912 "screen" canvas with a photo grid is
     scrolled like a person would (steady, flicks, jiggle) and fed through the app's real sampler
     (Chromium downscale) and flash detector. Expect zero events. Run: npm run demo, then open
     http://localhost:8765/test/browser/scroll-check.html (results also go to the console). -->
<meta charset="utf-8" />
<title>Scroll false-alarm check</title>
<pre id="out">running…</pre>
<script type="module">
  import { createFlashDetector } from '../../src/engine/flash.js';
  import { createSampler } from '../../src/overlay/capture.js';
  import { DEFAULT_PROFILES } from '../../src/shared/profiles.js';

  const W = 2940, H = 1912;
  const screen = new OffscreenCanvas(W, H);
  const sctx = screen.getContext('2d');
  // an endless page of "photos" (gradients, blobs, mixed brightness, white gutters), drawn per frame
  const tile = 460, gap = 12, step = tile + gap;
  const rand = (a, b, k) => {
    let h = (a * 374761393 + b * 668265263 + k * 1442695041) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  };
  function drawPage(offset) {
    sctx.fillStyle = '#fff';
    sctx.fillRect(0, 0, W, H);
    const row0 = Math.floor(offset / step);
    for (let row = row0; row * step < offset + H; row++) {
      const y = row * step - offset;
      for (let col = 0, x = gap; x < W; col++, x += step) {
        const kind = rand(row, col, 1);
        const base = kind < 0.25 ? [10, 15, 30] : kind > 0.8 ? [230, 235, 240] : [80 + 120 * rand(row, col, 2), 90 + 100 * rand(row, col, 3), 60 + 150 * rand(row, col, 4)];
        const g = sctx.createLinearGradient(x, y, x, y + tile);
        g.addColorStop(0, `rgb(${base.map((v) => Math.min(255, v + 60)).join(',')})`);
        g.addColorStop(1, `rgb(${base.map((v) => v * 0.5).join(',')})`);
        sctx.fillStyle = g;
        sctx.fillRect(x, y, tile, tile);
        for (let k = 0; k < 6; k++) {
          sctx.fillStyle = `rgba(${255 * rand(row, col, 10 + k)},${255 * rand(row, col, 20 + k)},${255 * rand(row, col, 30 + k)},0.6)`;
          sctx.beginPath();
          sctx.arc(x + tile * rand(row, col, 40 + k), y + tile * rand(row, col, 50 + k), 20 + 80 * rand(row, col, 60 + k), 0, 7);
          sctx.fill();
        }
      }
    }
  }
  const sampler = createSampler(screen, {});
  const profiles = {
    'steady 1000 px/s': (t) => 1000 * 2 * t,
    'steady 3000 px/s': (t) => 3000 * 2 * t,
    'flick': (t) => 9000 * (1 - Math.exp(-2.5 * t)),
    'jiggle': (t) => 600 * Math.sin(2 * Math.PI * 1.5 * t) + 600,
    'fast 6000 px/s': (t) => 6000 * 2 * t,
    'hard flick 12000 px/s': (t) => 12000 * 2 * (1 - Math.exp(-2 * t)) / 2,
  };
  const lines = [];
  for (const [name, pos] of Object.entries(profiles)) {
    const det = createFlashDetector({ ...DEFAULT_PROFILES.photosensitive.flash }); // strictest profile
    let events = 0, frames = 0;
    for (let f = 0; f < 120; f++) {
      const t = f / 30;
      drawPage(Math.round(pos(t)));
      const ev = det.push({ data: sampler.sample(), tMs: t * 1000 });
      if (ev.length) events++;
      frames++;
    }
    const d = det.diagnostics();
    lines.push(`${events ? 'FAIL' : 'ok  '} ${name}: ${events}/${frames} frames with events (max flashing area ${(100 * d.maxFlashingFraction).toFixed(1)}%, treated as motion ${(100 * d.movingShare).toFixed(0)}%)`);
  }
  document.getElementById('out').textContent = lines.join('\n');
  console.log('SCROLLCHECK\n' + lines.join('\n'));
</script>

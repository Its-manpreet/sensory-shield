<!doctype html>
<meta charset="utf-8" />
<title>shape check</title>
<!-- OWNER: Agent C. Free-form panes end to end WITHOUT the real screen:
       npx electron test/content/run-page.js test/content/shape-check.html
     A synthetic screen (page text naming triggers, a spider photo, a gun photo) plays into the real content
     loop + effects renderer through a canvas stream. Scenes: still, scrolling, the spider replaced by a cat,
     a switch to a text-only dark window. Prints coverage / spill / text-covered per scene and a small JPEG of
     the composited test screen (SNAP lines) so the blob shapes can be looked at. Synthetic content only. -->
<script type="importmap">
  { "imports": {
      "@huggingface/transformers": "../../node_modules/@huggingface/transformers/dist/transformers.web.js",
      "onnxruntime-web/webgpu": "../../node_modules/onnxruntime-web/dist/ort.webgpu.min.mjs",
      "onnxruntime-common": "../../node_modules/onnxruntime-web/dist/ort.webgpu.min.mjs" } }
</script>
<script type="module">
  import { createContentLoop } from '../../src/overlay/content-loop.js';
  import { createEffects } from '../../src/overlay/effects.js';
  import { createSampler } from '../../src/overlay/capture.js';

  const log = (...a) => console.log('[shape]', ...a);
  const W = 1470, H = 956;
  const screen = document.createElement('canvas');
  Object.assign(screen, { width: W, height: H });
  const sctx = screen.getContext('2d');
  const video = document.createElement('video');
  video.muted = true;
  const fx = document.createElement('canvas');
  const img = async (p) => createImageBitmap(await (await fetch(p)).blob());

  const spider = await img('../../assets/images/eval/spider/0.jpg');
  const gun = await img('../../assets/images/eval/gun/0.jpg');
  const cat = await img('../../assets/images/eval/cat/0.jpg');
  // a Google-Images-like results grid: justified rows, 10 px gaps, a caption under each thumbnail
  const gridPics = [];
  for (const [cls, n, trig] of [['spider', 6, true], ['gun', 3, true], ['cat', 4, false], ['pasta', 3, false], ['street', 3, false], ['portrait', 2, false]])
    for (let i = 0; i < n; i++) gridPics.push({ cls, trig, bmp: await img(`../../assets/images/eval/${cls}/${i}.jpg`) });
  {
    let seed = 3;
    const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
    for (let i = gridPics.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [gridPics[i], gridPics[j]] = [gridPics[j], gridPics[i]]; }
  }
  const fit = (b, maxW, maxH) => { const s = Math.min(maxW / b.width, maxH / b.height); return [b.width * s, b.height * s]; };
  const [sw, sh] = fit(spider, 420, 320), [gw, gh] = fit(gun, 420, 300);

  let scene = 'page', scroll = 0;
  const words = 'the of and to in a is that for on with as was by at from this have are not but one all they an'.split(' ');
  /** photos on screen now (normalized), for scoring */
  let photos = [], textLines = [];
  function drawScreen() {
    photos = [], textLines = [];
    if (scene.startsWith('grid')) {
      const oy = scene === 'grid-scrolled' ? -200 : 0;
      sctx.fillStyle = '#fff'; sctx.fillRect(0, 0, W, H);
      sctx.fillStyle = '#f1f3f4'; sctx.beginPath(); sctx.roundRect(160, 20 + oy, 640, 46, 23); sctx.fill();
      sctx.fillStyle = '#202124'; sctx.font = '17px -apple-system, sans-serif'; sctx.fillText('spiders', 190, 49 + oy);
      textLines.push({ x: 190 / W, y: (33 + oy) / H, w: 70 / W, h: 20 / H });
      sctx.font = '14px -apple-system, sans-serif';
      ['All', 'Images', 'Videos', 'News', 'Shopping'].forEach((t, k) => { sctx.fillStyle = k === 1 ? '#1a73e8' : '#5f6368'; sctx.fillText(t, 190 + k * 80, 100 + oy); });
      // justified rows of height 150
      let x = 20, y = 125 + oy, row = [];
      const flush = (last) => {
        const natural = row.reduce((a, r) => a + r.w, 0) + 10 * (row.length - 1);
        const k = last ? 1 : (W - 40 - 10 * (row.length - 1)) / (natural - 10 * (row.length - 1));
        let xx = 20;
        for (const r of row) {
          const w = r.w * k;
          sctx.drawImage(r.g.bmp, xx, y, w, 150);
          const rect = { name: r.g.cls, trig: r.g.trig, x: xx / W, y: y / H, w: w / W, h: 150 / H };
          photos.push(rect);
          sctx.fillStyle = '#5f6368'; sctx.font = '12px -apple-system, sans-serif';
          sctx.fillText('wikipedia.org', xx, y + 166);
          sctx.fillStyle = '#202124'; sctx.font = '13px -apple-system, sans-serif';
          sctx.fillText(`Spider - ${r.g.cls} facts`.slice(0, Math.max(6, Math.floor(w / 7.5))), xx, y + 183);
          textLines.push({ x: xx / W, y: (y + 170) / H, w: Math.min(w, 150) / W, h: 16 / H });
          xx += w + 10;
        }
        y += 150 + 46; row = [];
      };
      for (const g of gridPics) {
        const w = (g.bmp.width / g.bmp.height) * 150;
        row.push({ g, w });
        if (row.reduce((a, r) => a + r.w, 0) + 10 * row.length > W - 40) flush(false);
      }
      if (row.length) flush(true);
      return;
    }
    if (scene === 'fullscreen') {
      // no page around: a full-screen video frame, the spider in the middle of a busy scene
      sctx.drawImage(cat, 0, 0, W, H);
      sctx.drawImage(spider, 500, 300, 520, 400);
      photos.push({ name: 'spider', x: 500 / W, y: 300 / H, w: 520 / W, h: 400 / H });
      return;
    }
    if (scene === 'editor') {
      sctx.fillStyle = '#1e1e1e'; sctx.fillRect(0, 0, W, H);
      sctx.fillStyle = '#252526'; sctx.fillRect(0, 0, 260, H);
      sctx.font = '16px Menlo, monospace';
      for (let y = 40, k = 0; y < H; y += 26, k++) {
        sctx.fillStyle = ['#569cd6', '#ce9178', '#4ec9b0', '#dcdcaa'][k % 4];
        sctx.fillText(`const spiders${k} = loadGuns("spider", "guns"); // spiders and guns`, 290, y);
        textLines.push({ x: 290 / W, y: (y - 16) / H, w: 560 / W, h: 20 / H });
      }
      return;
    }
    sctx.fillStyle = '#fff'; sctx.fillRect(0, 0, W, H);
    const oy = -scroll;
    sctx.fillStyle = '#111'; sctx.font = '700 44px -apple-system, sans-serif';
    sctx.fillText('Spiders and guns: a field guide', 60, 90 + oy);
    textLines.push({ x: 60 / W, y: (50 + oy) / H, w: 680 / W, h: 50 / H });
    sctx.font = '17px -apple-system, sans-serif';
    let r = 0;
    for (let y = 150; y < H + 400; y += 26, r++) {
      let line = r % 3 === 0 ? 'Spiders and guns are discussed here. ' : '';
      while (line.length < 70) line += words[(r * 7 + line.length) % words.length] + ' ';
      sctx.fillStyle = '#333';
      sctx.fillText(line, 60, y + oy);
      if (r % 3 === 0) textLines.push({ x: 60 / W, y: (y - 16 + oy) / H, w: 320 / W, h: 22 / H });
    }
    const left = scene === 'swapped' ? cat : spider;
    const [lw, lh] = scene === 'swapped' ? fit(cat, 420, 320) : [sw, sh];
    sctx.drawImage(left, 820, 140 + oy, lw, lh);
    if (scene !== 'swapped') photos.push({ name: 'spider', x: 820 / W, y: (140 + oy) / H, w: lw / W, h: lh / H });
    sctx.drawImage(gun, 820, 520 + oy, gw, gh);
    photos.push({ name: 'gun', x: 820 / W, y: (520 + oy) / H, w: gw / W, h: gh / H });
  }

  drawScreen();
  video.srcObject = screen.captureStream(30);
  await video.play();
  const sampler = createSampler(video);
  const effects = createEffects(fx, video, { cssSize: () => [W, H], fadeMs: 200 });
  let regions = [];
  const content = createContentLoop({
    video, sampler, log, debug: true,
    modelsUrl: new URL('../../models/', location.href).href,
    onUpdate: () => (regions = content.regions()),
  });
  content.apply({ enabled: true, nudity: true, gore: false, violence: true, phobias: ['spiders'], custom: [], sexualText: false, sensitivity: 0.5 });

  function onFrame() {
    video.requestVideoFrameCallback(onFrame);
    content.tick(sampler.sample());
  }
  video.requestVideoFrameCallback(onFrame);
  function anim() {
    requestAnimationFrame(anim);
    drawScreen();
    regions = content.regions();
    effects.setRegions(regions, performance.now());
    effects.draw();
  }
  anim();

  /** covered = cells with alpha > 0.5 of the drawn shapes */
  function covered(x, y) {
    for (const r of regions) {
      const s = r.shape;
      if (!s) continue;
      if (s.clip && (x < s.clip.x || x > s.clip.x + s.clip.w || y < s.clip.y || y > s.clip.y + s.clip.h)) continue; // cut at the picture border
      const c = Math.floor((x - s.x) / s.cw), q = Math.floor((y - s.y) / s.ch);
      if (c >= 0 && q >= 0 && c < s.cols && q < s.rows && s.alpha[q * s.cols + c] > 0.5) return true;
    }
    return false;
  }
  const share = (rect) => {
    let n = 0, hit = 0;
    for (let a = 0; a < 24; a++) for (let b = 0; b < 24; b++, n++) hit += covered(rect.x + ((a + 0.5) / 24) * rect.w, rect.y + ((b + 0.5) / 24) * rect.h);
    return hit / n;
  };
  function measure(name) {
    let cov = 0, total = 0, outside = 0;
    for (let a = 0; a < 160; a++) for (let b = 0; b < 100; b++) {
      const x = (a + 0.5) / 160, y = (b + 0.5) / 100;
      if (!covered(x, y)) continue;
      total++;
      if (!photos.some((p) => x >= p.x - 0.01 && x <= p.x + p.w + 0.01 && y >= p.y - 0.01 && y <= p.y + p.h + 0.01)) outside++;
    }
    if (photos.some((p) => p.trig !== undefined)) {
      // a results grid: only thumbnails at least half on screen
      const vis = photos.filter((p) => p.y + p.h / 2 > 0 && p.y + p.h / 2 < 1);
      const t = vis.filter((p) => p.trig).map((p) => share(p)), h = vis.filter((p) => !p.trig).map((p) => share(p));
      const mean = (a) => (a.length ? (100 * a.reduce((x, y) => x + y, 0)) / a.length : 0).toFixed(0);
      log(`SCENE ${name}: ${t.length} trigger thumbnails covered mean ${mean(t)}% (worst ${(100 * Math.min(...t)).toFixed(0)}%, fully ${t.filter((v) => v > 0.9).length}/${t.length}); ${h.length} harmless thumbnails covered mean ${mean(h)}% (worst ${(100 * Math.max(...h)).toFixed(0)}%, any >20%: ${h.filter((v) => v > 0.2).length}); text lines covered ${textLines.filter((l) => share(l) > 0.2).length}/${textLines.length}`);
      return;
    }
    const per = photos.map((p) => `${p.name} ${(100 * share(p)).toFixed(0)}%`).join(', ');
    const textHit = textLines.filter((l) => share(l) > 0.2).length;
    log(`SCENE ${name}: panes ${regions.filter((r) => r.shape).length}; photos covered: ${per || 'none on screen'}; spill outside photos ${total ? ((100 * outside) / total).toFixed(0) : 0}% of cover; text lines covered ${textHit}/${textLines.length}`);
  }
  function snap(name) {
    const out = document.createElement('canvas');
    Object.assign(out, { width: 735, height: 478 });
    const o = out.getContext('2d');
    o.drawImage(screen, 0, 0, 735, 478);
    o.drawImage(fx, 0, 0, 735, 478);
    log(`SNAP ${name} ${out.toDataURL('image/jpeg', 0.8)}`);
  }
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  /** time from a scene change until nothing is drawn over `rect` any more (any visible cell, alpha > 0.05) */
  function visibleOver(rect) {
    for (const r of regions) {
      const s = r.shape;
      if (!s) continue;
      for (let i = 0; i < s.alpha.length; i++) {
        if (s.alpha[i] <= 0.05) continue;
        const cx = s.x + ((i % s.cols) + 0.5) * s.cw, cy = s.y + (((i / s.cols) | 0) + 0.5) * s.ch;
        if (cx >= rect.x && cx <= rect.x + rect.w && cy >= rect.y && cy <= rect.y + rect.h) return true;
      }
    }
    return false;
  }
  async function clearTime(rect, maxMs = 3000) {
    const t0 = performance.now();
    while (performance.now() - t0 < maxMs) {
      if (!visibleOver(rect)) return Math.round(performance.now() - t0);
      await new Promise(requestAnimationFrame);
    }
    return 'never';
  }

  // models load first (blurs need them)
  for (let i = 0; i < 120 && !content.stats || i < 1; i++) await wait(100);
  await wait(9000);
  measure('still page'); snap('still');
  const t0 = performance.now();
  while (performance.now() - t0 < 1200) { scroll = Math.round(((performance.now() - t0) / 1200) * 180); await wait(16); }
  scroll = 180;
  measure('right after scrolling 180 px'); await wait(1500);
  measure('scrolled, settled'); snap('scrolled');
  const spiderNow = photos.find((p) => p.name === 'spider');
  scene = 'swapped';
  log(`DECAY spider replaced by a cat: cover gone after ${await clearTime(spiderNow)} ms`);
  await wait(2000);
  measure('spider replaced by a cat'); snap('swapped');
  scene = 'fullscreen'; await wait(3000);
  measure('full-screen video frame (no page)'); snap('fullscreen');
  scene = 'editor';
  log(`DECAY switched to another window: all cover gone after ${await clearTime({ x: 0, y: 0, w: 1, h: 1 })} ms`);
  await wait(2000);
  measure('switched to a text-only dark window'); snap('editor');
  scene = 'grid'; await wait(6000);
  measure('image search results grid'); snap('grid');
  scene = 'grid-scrolled';
  await wait(2500);
  measure('results grid scrolled 200 px'); snap('grid-scrolled');
  log('DONE');
</script>

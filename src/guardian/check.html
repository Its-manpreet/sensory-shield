<!doctype html>
<!-- Guardian "Are you OK?" check. Calm and static on purpose: no flashing, no motion (photosensitive users). -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Are you OK?</title>
    <style>
      :root { font: 16px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif; color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #1c2b29; color: #f2f5f4; }
      body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 28px; box-sizing: border-box; text-align: center; -webkit-app-region: drag; user-select: none; }
      h1 { font-size: 30px; margin: 0; font-weight: 650; }
      p { margin: 0; color: #c4d2cf; max-width: 420px; }
      .count { font-size: 54px; font-weight: 700; font-variant-numeric: tabular-nums; color: #ffffff; line-height: 1; }
      button {
        -webkit-app-region: no-drag;
        font: inherit; font-size: 22px; font-weight: 650;
        padding: 18px 44px; border-radius: 16px; border: 0;
        background: #6cc3b2; color: #0f2420; cursor: pointer; min-width: 280px;
      }
      button { position: relative; overflow: hidden; }
      button::after { content: ""; position: absolute; inset: auto 0 0 0; height: 6px; background: #0f2420; opacity: 0.35; transform: scaleX(0); transform-origin: left; }
      button.holding::after { transform: scaleX(1); transition: transform 1s linear; }
      .holdhint { font-size: 13px; color: #a9bbb7; margin-top: -6px; }
      button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
      .results { list-style: none; padding: 0; margin: 0; color: #c4d2cf; font-size: 14px; }
      .bad { color: #ffcf8a; }
      .fine { font-size: 12px; color: #8fa39f; max-width: 440px; }
    </style>
  </head>
  <body>
    <h1 id="title">Are you OK?</h1>
    <p id="why"></p>
    <div class="count" id="count" aria-live="off"></div>
    <p id="next"></p>
    <button id="ok" tabindex="-1">I'm OK</button>
    <p class="holdhint" id="holdhint">Press and hold for 1 second</p>
    <ul class="results" id="results" aria-live="polite"></ul>
    <p class="fine">Sensory Shield Guardian may notice strong rhythmic movement. It is not a medical device and can miss seizures or raise false alarms.</p>
    <script type="module" src="./check.js"></script>
  </body>
</html>

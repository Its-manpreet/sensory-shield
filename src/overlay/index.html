<!doctype html>
<!-- OWNER: Agent A. Transparent full-screen overlay. Draws effects only; never saves frames. -->
<html>
  <head>
    <meta charset="utf-8" />
    <title>Sensory Shield overlay</title>
    <style>
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
      canvas, video { position: fixed; inset: 0; width: 100vw; height: 100vh; }
      video { visibility: hidden; } /* captured stream is a pixel source only */
    </style>
  </head>
  <body>
    <video id="capture" muted playsinline></video>
    <canvas id="fx"></canvas>
    <!-- on-device models (child safety): Transformers.js + ONNX Runtime Web, loaded from node_modules -->
    <script type="importmap">
      {
        "imports": {
          "@huggingface/transformers": "../../node_modules/@huggingface/transformers/dist/transformers.web.js",
          "onnxruntime-web/webgpu": "../../node_modules/onnxruntime-web/dist/ort.webgpu.min.mjs",
          "onnxruntime-common": "../../node_modules/onnxruntime-web/dist/ort.webgpu.min.mjs"
        }
      }
    </script>
    <script type="module" src="./overlay.js"></script>
  </body>
</html>
